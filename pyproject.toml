[project]
name = "dcc-mcp-maya-procedural-architecture"
version = "0.1.0"
requires-python = ">=3.7"

[tool.ruff]
target-version = "py37"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
