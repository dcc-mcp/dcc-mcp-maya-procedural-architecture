# NOT PUBLISHED TO PYPI - this repository is an agent skill pack, not a
# distributable Python package. There is no importable module under src/:
# the deliverable is the markdown skill definitions under skill/, which are
# consumed from the repo or the skill marketplace, never via pip install.
# Publishing it would permanently occupy a dcc-mcp namespace slot on PyPI
# while shipping an empty metadata-only wheel. Tracked in PIP-3630.
[project]
name = "dcc-mcp-maya-procedural-architecture"
version = "1.1.0"
requires-python = ">=3.7"

[tool.ruff]
target-version = "py37"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
