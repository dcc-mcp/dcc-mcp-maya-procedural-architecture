tools:
  - name: generate_realistic_house
    description: Generate a detailed seeded house across six architectural styles with realistic or stylized Arnold materials, optional CC0 HDR lighting, and an animated camera orbit.
    source_file: scripts/generate_realistic_house.py
    input_schema:
      type: object
      required: [material_assets, workspace_dir]
      properties:
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Reuse a returned seed to reproduce the same house.
        style:
          type: string
          enum: [craftsman, farmhouse, cottage, tudor, coastal, modern_farmhouse]
          default: craftsman
        look:
          type: string
          enum: [realistic, stylized]
          default: realistic
        name:
          type: string
          default: RealisticHouse
        workspace_dir:
          type: string
          description: Absolute directory for extracted textures and attribution manifest.
        material_assets:
          type: object
          required: [siding, roof, brick, concrete]
          properties:
            siding: {type: object}
            roof: {type: object}
            brick: {type: object}
            concrete: {type: object}
          additionalProperties: false
        environment_asset:
          type: object
          description: Optional CC0 HDR AssetDescriptor used by the Arnold skydome.
        environment_rotation:
          type: number
          default: 0.0
          description: Y-axis rotation in degrees for the HDR environment.
        environment_exposure:
          type: number
          minimum: -10.0
          maximum: 10.0
          default: 0.0
        replace:
          type: boolean
          default: true
        frame_count:
          type: integer
          minimum: 24
          maximum: 240
          default: 96
      additionalProperties: false
    output_schema:
      type: object
      required: [success, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 600
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success:
        - maya-render__render_frame
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log

  - name: show_house_generator
    description: Open a cancellable Maya Qt dialog for randomized Bifrost houses with selectable realistic or stylized material looks.
    source_file: scripts/show_house_generator.py
    input_schema:
      type: object
      required: [material_assets, workspace_dir]
      properties:
        material_assets:
          type: object
          required: [siding, roof, brick, concrete]
          properties:
            siding: {type: object}
            roof: {type: object}
            brick: {type: object}
            concrete: {type: object}
          additionalProperties: false
        environment_asset:
          type: object
          description: Optional CC0 HDR AssetDescriptor used by the Arnold skydome.
        environment_rotation:
          type: number
          default: 0.0
        environment_exposure:
          type: number
          minimum: -10.0
          maximum: 10.0
          default: 0.0
        workspace_dir:
          type: string
        name:
          type: string
          default: RealisticHouse
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        style:
          type: string
          enum: [craftsman, farmhouse, cottage, tudor, coastal, modern_farmhouse]
          default: craftsman
        look:
          type: string
          enum: [realistic, stylized]
          default: realistic
      additionalProperties: false
    output_schema:
      type: object
      required: [success, context]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: []
      on-failure:
        - dcc_diagnostics__screenshot
